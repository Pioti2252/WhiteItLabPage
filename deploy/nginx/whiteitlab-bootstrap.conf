# TEMPORARY config for the very first certificate issuance.
# The full config references certificates that don't exist yet, so nginx would
# refuse to start. Use this file, run certbot, then switch to whiteitlab.conf.
server {
    listen 80;
    listen [::]:80;
    server_name whiteitlab.pl www.whiteitlab.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
