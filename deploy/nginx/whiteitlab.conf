# /etc/nginx/sites-available/whiteitlab.conf   (symlink into sites-enabled)
# Host nginx = TLS termination + reverse proxy to the container on 127.0.0.1:8080.
# Compatible with nginx >= 1.18 (Debian 12 / Ubuntu 22.04+).
# Certificates: certbot --webroot, see docs/DEPLOYMENT.md.
#
# Files in sites-enabled are included inside the `http {}` block, so the
# zone/upstream definitions below are valid here.

# --- rate limiting: first line of defence for the form (app has its own too)
limit_req_zone $binary_remote_addr zone=wl_contact:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=wl_general:10m rate=20r/s;

upstream whiteitlab_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# --- HTTP: ACME challenge + redirect everything else to HTTPS -------------
server {
    listen 80;
    listen [::]:80;
    server_name whiteitlab.pl www.whiteitlab.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://whiteitlab.pl$request_uri;
    }
}

# --- HTTPS www -> apex -----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.whiteitlab.pl;

    ssl_certificate     /etc/letsencrypt/live/whiteitlab.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whiteitlab.pl/privkey.pem;
    include /etc/nginx/snippets/whiteitlab-tls.conf;

    return 301 https://whiteitlab.pl$request_uri;
}

# --- HTTPS main site -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whiteitlab.pl;

    ssl_certificate     /etc/letsencrypt/live/whiteitlab.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whiteitlab.pl/privkey.pem;
    include /etc/nginx/snippets/whiteitlab-tls.conf;

    server_tokens off;
    client_max_body_size 32k;       # the form never needs more (app limit: 16k)
    client_body_timeout 10s;
    client_header_timeout 10s;

    # HSTS only makes sense on the TLS terminator, so it lives here, not in the app.
    # Add "; preload" only after you're sure every subdomain serves HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Compression (app sends uncompressed; nginx does it once, close to the client)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/plain;

    access_log /var/log/nginx/whiteitlab.access.log;
    error_log  /var/log/nginx/whiteitlab.error.log warn;

    # Proxy headers (inherited by locations below)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;     # app trusts this when TRUST_PROXY=1
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    location = /api/contact {
        limit_except POST { deny all; }
        limit_req zone=wl_contact burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://whiteitlab_web;
    }

    # Health endpoint is for Docker/monitoring on the host, not the public.
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://whiteitlab_web;
    }

    location / {
        limit_req zone=wl_general burst=40 nodelay;
        proxy_pass http://whiteitlab_web;
    }
}
